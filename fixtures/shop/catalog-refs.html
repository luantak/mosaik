<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Catalog</title>
  </head>
  <body>
    <main>
      <form aria-label="Catalog search">
        <label>Search <input name="q" /></label>
        <button type="submit">Search</button>
      </form>
      <ul>
        <li>
          <a href="/bowl" data-testid="product">
            <span data-testid="title">Mixing bowl</span>
            <span data-testid="price">$24.00</span>
          </a>
        </li>
        <li>
          <a href="/mug" data-testid="product">
            <span data-testid="title">Ceramic mug</span>
            <span data-testid="price">$18.00</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
