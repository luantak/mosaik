<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shop checkout</title>
  </head>
  <body>
    <main>
      <form name="billing-form" aria-label="Billing" id="billing-form">
        <h2>Billing</h2>
        <label for="billing-email">Email</label>
        <input id="billing-email" name="email" data-testid="billing-email" />
      </form>
      <form name="shipping-form" aria-label="Shipping" id="shipping-form">
        <h2>Shipping</h2>
        <label for="shipping-email">Email</label>
        <input id="shipping-email" name="email" data-testid="shipping-email" />
      </form>
    </main>
  </body>
</html>
